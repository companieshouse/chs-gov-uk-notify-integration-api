spring.mongodb.uri=${MONGODB_URL}
spring.mongodb.representation.uuid=java-legacy
spring.data.mongodb.auto-index-creation=true

# This allows us to see the queries that are executed against the database for the view letter endpoints.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Actuator health check config
management.endpoints.access.default=read_only
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=/gov-uk-notify-integration/healthcheck
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
management.opentelemetry.enabled=${OTEL_LOG_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

gov.uk.notify.api.key=${CHS_GOV_UK_NOTIFY_INTEGRATION_API_KEY}

chs.notification.aws.s3-endpoint=https://s3.${AWS_REGION:eu-west-2}.amazonaws.com
chs.notification.aws.bucket-name=${CHS_NOTIFICATION_AWS_BUCKETNAME}
chs.notification.aws.region=${AWS_REGION:eu-west-2}
chs.notification.aws.path-style-access-enabled=false

spring.http.converters.preferred-json-mapper=jackson
