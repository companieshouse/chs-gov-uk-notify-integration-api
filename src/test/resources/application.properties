spring.application.name=chs-gov-uk-notify-integration-api

spring.data.mongodb.auto-index-creation=true

gov.uk.notify.api.key=fake-key-for-tests

spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.database=${MONGODB_DATABASE:notification}

# This allows us to see the queries that are executed against the database for the view letter endpoints.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Comment this in to save a PDF for each letter to the user's home directory. Do so ONLY FOR TROUBLESHOOTING,
# because otherwise many PDF files could accumulate there.
#save.letter=true

chs.notification.aws.s3-endpoint=s3://aws.s3.${AWS_REGION:eu-west-2}.amazonaws.com
chs.notification.aws.bucket-name=notification-attachments
chs.notification.aws.region=${AWS_REGION:eu-west-2}
chs.notification.aws.access-key-id=${AWS_ACCESS_KEY_ID}
chs.notification.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
chs.notification.aws.path-style-access-enabled=false
